name: Daily MongoDB Backup

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install MongoDB Database Tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Create Backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          mkdir -p backups
          DATE=$(date +'%Y-%m-%d')
          mongodump --uri="$MONGO_URI" --out="backups/shopledger-$DATE"
          tar -czvf "shopledger-backup-$DATE.tar.gz" -C backups "shopledger-$DATE"

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: shopledger-daily-backup
          path: shopledger-backup-*.tar.gz
          retention-days: 7 # Keeps backups for 7 days
