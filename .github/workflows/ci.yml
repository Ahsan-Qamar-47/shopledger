name: CI Pipeline

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  client-build-and-lint:
    name: Client Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Lint Client Source Code
        run: |
          cd client
          npm run lint

      - name: Build Production Client Bundle
        run: |
          cd client
          npm run build

  server-verification:
    name: Server Syntax & Environment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm install

      - name: Validate Server Syntax
        run: |
          cd server
          node -c server.js
          node -c controllers/authController.js
          node -c controllers/dashboardController.js
          node -c controllers/expenseController.js
          node -c controllers/transactionController.js
          node -c middleware/rbac.js
          node -c middleware/auth.js
